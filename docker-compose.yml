# UsageOS: works out of the box with `docker compose up -d --build`.
# Running behind Caddy/Traefik on a shared Docker network? See docker-compose.proxy.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: usageos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-server}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-server}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # local only; handy for development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-server} -d ${POSTGRES_DB:-server}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: usageos-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-server}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-server}
      SERVER_API_KEY: ${SERVER_API_KEY:?Set SERVER_API_KEY in .env}
      # Password typed once per device on the dashboard login screen. Falls back to SERVER_API_KEY when empty.
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Required for the Telegram webhook to accept messages (see README, Telegram section).
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    volumes:
      - usageos_uploads:/app/uploads
    ports:
      # Only reachable from this machine; the dashboard container proxies /api to it.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: usageos-frontend
    ports:
      - "${USAGEOS_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  usageos_uploads:
