[project]
name = "usageos-backend"
version = "0.1.0"
description = "UsageOS backend API: multi-account Claude usage tracking"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
authors = [{ name = "UsageOS contributors" }]
# Runtime dependencies live in requirements.txt (the Dockerfile installs from it).

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 110
